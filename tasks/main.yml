---
- name: Set defaults
  ansible.builtin.set_fact:
    apt_keyrings: /etc/apt/keyrings
    # 20.19.5-1nodesource1
    nodejs_major_version: "{{ nodejs_version | regex_replace('^([0-9]+)(.*)$', '\\1') }}"
    # used for filenames
    visible_name: nodejs
- name: Set defaults
  ansible.builtin.set_fact:
    local_apt_key: "{{ apt_keyrings }}/{{ visible_name }}.gpg"
- name: Set defaults
  ansible.builtin.set_fact:
    apt_package: nodejs={{ nodejs_version }}
    apt_source_list_name: local-{{ visible_name }}.list
    # https://github.com/nodesource/distributions/blob/master/scripts/deb/setup_22.x
    # Ansible has no amd64, only "ansible_architecture": "x86_64"
    # 2025-10-30: Providing "amd64,arm64" works.
    apt_repository: >
      deb [arch=amd64,arm64 signed-by={{ local_apt_key }}]
      https://deb.nodesource.com/node_{{ nodejs_major_version }}.x nodistro main
    gpg_key_src: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key

- name: Install docker package
  ansible.builtin.include_tasks: install.yml
